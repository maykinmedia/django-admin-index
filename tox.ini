[tox]
envlist =
  py311-django52
  py{312,313}-django{52,61}
  isort
  black
  flake8
skip_missing_interpreters = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    5.2: django52
    6.1: django61

[testenv]
setenv =
  DJANGO_SETTINGS_MODULE=tests.proj.settings
  PYTHONPATH={toxinidir}
extras =
    tests
    coverage
deps =
  django52: Django~=5.2.0
  django61: Django~=6.1.0

commands =
  pytest -v \
    --cov-report=term \
    --cov-report xml:reports/coverage-{envname}.xml \
    {posargs}

[testenv:isort]
extras = tests
skipsdist = True
commands = isort --check-only --diff .

[testenv:black]
extras = tests
skipsdist = True
commands = black --check django_admin_index tests

[testenv:flake8]
extras = tests
skipsdist = True
commands = flake8 .
